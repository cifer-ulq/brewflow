services:

  # ── Databases ────────────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks: [erp-network]

  inventory-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks: [erp-network]

  orders-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    networks: [erp-network]

  hr-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hr_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hr-db-data:/var/lib/postgresql/data
    networks: [erp-network]

  finance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - finance-db-data:/var/lib/postgresql/data
    networks: [erp-network]

  # ── Microservices ─────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on: [auth-db]
    networks: [erp-network]

  inventory-service:
    build: ./services/inventory-service
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on: [inventory-db, auth-service]
    networks: [erp-network]

  orders-service:
    build: ./services/orders-service
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: orders-db
      DB_PORT: 5432
      DB_NAME: orders_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      FINANCE_SERVICE_URL: http://finance-service:3005
    depends_on: [orders-db, auth-service, inventory-service, finance-service]
    networks: [erp-network]

  hr-service:
    build: ./services/hr-service
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: hr-db
      DB_PORT: 5432
      DB_NAME: hr_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on: [hr-db, auth-service]
    networks: [erp-network]

  finance-service:
    build: ./services/finance-service
    restart: unless-stopped
    environment:
      PORT: 3005
      DB_HOST: finance-db
      DB_PORT: 5432
      DB_NAME: finance_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on: [finance-db, auth-service]
    networks: [erp-network]

  # ── API Gateway ───────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      ORDERS_SERVICE_URL: http://orders-service:3003
      HR_SERVICE_URL: http://hr-service:3004
      FINANCE_SERVICE_URL: http://finance-service:3005
    depends_on:
      - auth-service
      - inventory-service
      - orders-service
      - hr-service
      - finance-service
    networks: [erp-network]

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [api-gateway]
    networks: [erp-network]

networks:
  erp-network:
    driver: bridge

volumes:
  auth-db-data:
  inventory-db-data:
  orders-db-data:
  hr-db-data:
  finance-db-data:
