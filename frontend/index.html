<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrewFlow ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d4c4b0; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #b8a48a; }
      .el-button--primary { background: #D97706 !important; border-color: #D97706 !important; }
      .el-button--primary:hover { background: #B45309 !important; border-color: #B45309 !important; }
      .el-button--primary:focus { background: #B45309 !important; border-color: #B45309 !important; }
      .el-button--primary.is-plain { background: #FEF3C7 !important; border-color: #F59E0B !important; color: #92400E !important; }
      .el-checkbox__input.is-checked .el-checkbox__inner,
      .el-radio__input.is-checked .el-radio__inner { background-color: #D97706 !important; border-color: #D97706 !important; }
      .el-input__wrapper.is-focus { box-shadow: 0 0 0 1px #D97706 inset !important; }
      .el-select .el-input.is-focus .el-input__wrapper { box-shadow: 0 0 0 1px #D97706 inset !important; }
      .el-tag--success { background-color: #D1FAE5 !important; border-color: #6EE7B7 !important; color: #065F46 !important; }
      .el-tag--warning { background-color: #FEF3C7 !important; border-color: #FCD34D !important; color: #92400E !important; }
      .el-tag--danger  { background-color: #FEE2E2 !important; border-color: #FCA5A5 !important; color: #991B1B !important; }
      .el-tag--info    { background-color: #F3F4F6 !important; border-color: #D1D5DB !important; color: #374151 !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
